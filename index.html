    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #111827; /* Dark Gray from logo, equivalent to Tailwind's gray-900 */
            color: #E5E7EB; /* Light Gray, equivalent to Tailwind's gray-200 */
        }

        /* Enhanced glassmorphism header */
        header {
            background-color: rgba(17, 24, 39, 0.5); /* gray-900 with transparency */
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(55, 65, 81, 0.5); /* gray-700 with opacity */
        }
        
        /* Card styles with a subtle red glow */
        .glow-card {
            transition: transform 0.3s, box-shadow 0.3s;
            background-color: rgba(31, 41, 55, 0.7); /* gray-800 */
            border: 1px solid #4B5563; /* gray-600 */
            border-radius: 0.75rem;
        }

        .glow-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 0 25px rgba(239, 68, 68, 0.2); /* Red glow */
        }
        
        /* Animated gradient using logo's red */
        .animated-gradient {
            background: linear-gradient(90deg, #F87171, #EF4444, #F87171); /* red-400, red-500 */
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradient-animation 4s ease infinite;
        }

        @keyframes gradient-animation {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Page visibility controlled by JS */
        .app-page {
            display: none;
            padding-top: 5rem;
            padding-bottom: 5rem;
            min-height: 100vh;
            animation: fadeIn 0.5s ease-in-out;
        }
        .app-page.active {
            display: block;
        }
        
        #homePage {
            padding-top: 0;
            padding-bottom: 0;
        }

        /* Canvas for background animation */
        #hero-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Custom form input styles */
        .form-input {
            width: 100%;
            padding: 0.75rem;
            border-radius: 0.375rem;
            background-color: #374151; /* gray-700 */
            border: 1px solid #4B5563; /* gray-600 */
            color: #E5E7EB;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .form-input:focus {
            outline: none;
            border-color: #EF4444; /* red-500 */
            box-shadow: 0 0 0 2px rgba(239, 68, 68, 0.4);
        }

        /* Help Desk Chat Styles */
        #help-desk-fab {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            z-index: 1000;
        }
        #chat-window {
            position: fixed;
            bottom: 6rem;
            right: 2rem;
            width: 90%;
            max-width: 400px;
            height: 70vh;
            max-height: 600px;
            z-index: 1000;
            transition: opacity 0.3s, transform 0.3s;
        }
        #chat-window.hidden {
            opacity: 0;
            transform: translateY(20px);
            pointer-events: none;
        }

        /* Client Portal Tab styles */
        .portal-tab {
            transition: background-color 0.2s, color 0.2s, border-color 0.2s;
            border-bottom: 2px solid transparent;
        }
        .portal-tab.active {
            border-bottom-color: #EF4444; /* red-500 */
            color: white;
        }
        
        .stat-bar-bg {
            background-color: #374151; /* gray-700 */
        }
        .stat-bar-fill {
            transition: width 0.5s ease-in-out;
        }

        /* Modal styles */
        .modal-overlay {
            transition: opacity 0.2s ease-in-out;
        }
        .modal-content {
            transition: transform 0.2s ease-in-out;
        }
    </style>
</head>

                constructor(x, y, directionX, directionY, size, color) { this.x = x; this.y = y; this.directionX = directionX; this.directionY = directionY; this.size = size; this.color = color; }
                draw() { ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2, false); ctx.fillStyle = this.color; ctx.fill(); }
                update() {
                    if (this.x > canvas.width || this.x < 0) { this.directionX = -this.directionX; }
                    if (this.y > canvas.height || this.y < 0) { this.directionY = -this.directionY; }
                    this.x += this.directionX;
                    this.y += this.directionY;
                    this.draw();
                }
            }
            
            function initParticles() {
                particles = [];
                let numberOfParticles = (canvas.height * canvas.width) / 9000;
                for (let i = 0; i < numberOfParticles; i++) {
                    let size = (Math.random() * 2) + 1;
                    let x = (Math.random() * ((innerWidth - size * 2) - (size * 2)) + size * 2);
                    let y = (Math.random() * ((innerHeight - size * 2) - (size * 2)) + size * 2);
                    let directionX = (Math.random() * .4) - .2;
                    let directionY = (Math.random() * .4) - .2;
                    let color = 'rgba(239, 68, 68, 0.7)';
                    particles.push(new Particle(x, y, directionX, directionY, size, color));
                }
            }
            
            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                initParticles();
            }
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

                for (let a = 0; a < particles.length; a++) {
                    for (let b = a; b < particles.length; b++) {
                        let distance = ((particles[a].x - particles[b].x) * (particles[a].x - particles[b].x)) + ((particles[a].y - particles[b].y) * (particles[a].y - particles[b].y));

                        }

                }

            let animationFrameId;
            function animate() {

        function addChatMessage(message, sender, chatBody) {
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('p-3', 'rounded-lg', 'max-w-[80%]', 'text-sm');
            
            if (sender === 'user') {
                messageDiv.classList.add('bg-red-500', 'text-white', 'self-end', 'ml-auto');
                messageDiv.textContent = message;
            } else {
                messageDiv.classList.add('bg-gray-700', 'text-gray-200', 'self-start', 'mr-auto');
                messageDiv.innerHTML = message; // Use innerHTML to render formatted text
            }
             if (sender === 'gemini-typing') {
                messageDiv.classList.add('gemini-typing');
            }
            
            chatBody.appendChild(messageDiv);
            chatBody.scrollTop = chatBody.scrollHeight; // Auto-scroll to bottom
        }

        async function handleChatSubmit(userInput, chatBody, promptTemplate) {
            addChatMessage(userInput, 'user', chatBody);
            addChatMessage('Gemini is typing...', 'gemini-typing', chatBody);
            
            try {
                const prompt = promptTemplate.replace('${userInput}', userInput);
                const payload = { contents: [{ role: "user", parts: [{ text: prompt }] }] };
                const apiKey = "";
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`;
                const response = await fetch(apiUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                const result = await response.json();

                chatBody.querySelector('.gemini-typing')?.remove();

                if (result.candidates && result.candidates.length > 0) {
                    const text = result.candidates[0].content.parts[0].text;
                    addChatMessage(text, 'gemini', chatBody);
                } else {
                    addChatMessage('Sorry, I couldn\'t find an answer for that. Please try rephrasing your question.', 'gemini', chatBody);
                }
            } catch (error) {
                console.error('Gemini API Error:', error);
                chatBody.querySelector('.gemini-typing')?.remove();
                addChatMessage('Sorry, there was an error connecting to the help desk. Please try again later.', 'gemini', chatBody);
            }
        }

        function populateFaqs(faqContainer) {
            if(!faqContainer) return;
            let faqHtml = '<h4 class="font-bold text-lg mb-2 text-red-400">Frequently Asked Questions</h4><div class="space-y-2">';
            for(const [question, answer] of Object.entries(faqs)) {
                faqHtml += `<details class="bg-gray-700/50 p-2 rounded-lg cursor-pointer"><summary class="font-semibold text-sm">${question}</summary><p class="text-sm mt-2 p-2 text-gray-300">${answer}</p></details>`;
            }
            faqHtml += '</div>';
            faqContainer.innerHTML = faqHtml;
        }

                e.preventDefault();

        function initAiHelpDeskPage() {
            const loginSection = document.getElementById('login-section');
            const dashboardSection = document.getElementById('client-dashboard');
            const loginForm = document.getElementById('client-login-form');
            if(!loginForm) return;

            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const credential = document.getElementById('client_credential').value;
                const pass = document.getElementById('client_password').value;
                const errorDiv = document.getElementById('login-error');
                errorDiv.classList.add('hidden');

                const backendUrl = 'https://lns-api-proxy.onrender.com';
                
                try {
                    const response = await fetch(`${backendUrl}/api/authenticate`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ credential, password: pass })
                    });
                    
                    if (!response.ok) {
                        throw new Error('Authentication failed');
                    }

                    const data = await response.json();

                    if (data.success) {
                        AppState.currentUser = data.user;
                        loginSection.classList.add('hidden');
                        dashboardSection.classList.remove('hidden');
                        document.getElementById('welcome-message').textContent = `Welcome, ${data.user.name}`;
                        initClientDashboard(data.user.role);
                    } else {
                        errorDiv.classList.remove('hidden');
                    }
                } catch (err) {
                    console.error('Login error:', err);
                    errorDiv.textContent = 'Could not connect to the portal. Please try again later.';
                    errorDiv.classList.remove('hidden');
                }
            });
        }

                : allTabs.filter(tab => ['assets', 'tickets', 'ai-help-desk'].includes(tab.id));

                `<button data-tab="${tab.id}" class="portal-tab whitespace-nowrap py-4 px-1 font-medium text-sm">${tab.label}</button>`

            const tabs = tabsContainer.querySelectorAll('.portal-tab');

            showTab(userRole === 'admin' ? 'tickets' : 'assets', userRole);

        function showTab(tabId, userRole) {
            destroyTimers();
            const portalContent = document.getElementById('portal-content');
            const tabs = document.querySelectorAll('.portal-tab');
            if (!portalContent || !tabs.length) return;

            tabs.forEach(t => {
                t.classList.toggle('active', t.dataset.tab === tabId);
            });

            if (tabId === 'tickets') initTicketsTab(userRole); 
            else if (tabId === 'assets') initAssetsTab(userRole);
            else if (tabId === 'invoices') initInvoicesTab();
            else if (tabId === 'users') initUsersTab();

        function initContactPage() {
            const challengesInput = document.getElementById('challenges');
            const suggestionsContainer = document.getElementById('service-suggestions');
            if (!challengesInput || !suggestionsContainer) return;

            let debounceTimer;
            challengesInput.addEventListener('input', () => {
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(async () => {
                    const text = challengesInput.value;
                    if (text.length < 20) return;

                    const prompt = `Based on the following IT problem description, identify which of these services are most relevant: Managed IT Services, Cybersecurity, Cloud Solutions, Network Support, Data Backup & Recovery, Specific Project. Return a comma-separated list of the most relevant services. Description: "${text}"`;
                    
                    try {
                       const payload = { contents: [{ role: "user", parts: [{ text: prompt }] }] };
                       const apiKey = "";
                       const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`;
                       const response = await fetch(apiUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                       const result = await response.json();
                       if (result.candidates && result.candidates.length > 0) {
                           const suggestions = result.candidates[0].content.parts[0].text.split(',').map(s => s.trim());
                           
                           suggestionsContainer.querySelectorAll('input[type="checkbox"]').forEach(checkbox => {
                               checkbox.checked = suggestions.includes(checkbox.value);
                           });
                       }
                    } catch (error) {
                        console.error('Error fetching service suggestions:', error);
                    }
                }, 1000);
            });
        }

        // --- INITIAL LOAD ---
        showPage('homePage');
        initFabHelpDesk();
    });
